name: Deploy GodStar WebApp to GitHub Pages

# مینی‌اپ «گاد استار» (پوشه‌ی webapp) روی GitHub Pages منتشر می‌شود.
# آدرس نهایی در WEBAPP_URL (Secret) به ربات داده می‌شود.

on:
  push:
    branches: [main]
    paths: ["webapp/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: godstar-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp

      - id: deployment
        uses: actions/deploy-pages@v4
